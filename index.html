<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmcL02</title>
<style>
/* ===========================================
   药理学学习地图 — 样式（改这里可以换配色/字号）
   =========================================== */

:root{
  --bg:#f6f7f9;
  --panel:#ffffff;
  --panel-2:#fbfcfd;
  --text:#1b2430;
  --text-2:#5b6775;
  --text-3:#8b97a5;
  --line:#e5e9ee;
  --line-2:#eef1f5;
  --accent:#0d7a6f;        /* 主色：青绿 */
  --accent-soft:#e6f4f1;
  --accent-2:#2f6dd0;      /* 次色：蓝 */
  --warn:#b45309;
  --warn-soft:#fdf5e6;
  --ok:#15803d;
  --ok-soft:#eaf7ee;
  --radius:12px;
  --sidebar-w:290px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -18px rgba(16,24,40,.18);
}
html[data-theme="dark"]{
  --bg:#12161c;
  --panel:#181e26;
  --panel-2:#1b222b;
  --text:#e7edf4;
  --text-2:#a8b6c6;
  --text-3:#7b8998;
  --line:#2a333e;
  --line-2:#232b35;
  --accent:#4fd1bd;
  --accent-soft:#173029;
  --accent-2:#7aa7e8;
  --warn:#f0b429;
  --warn-soft:#2c2517;
  --ok:#5fd68a;
  --ok-soft:#17281c;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:15px/1.75 "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

.app{display:flex;min-height:100vh}

/* ---------------- 侧边栏 ---------------- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--panel);
  border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  z-index:30;
}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 10px}
.brand-mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:17px;
}
.brand-text{display:flex;flex-direction:column;line-height:1.3}
.brand-text strong{font-size:15px}
.brand-text span{font-size:12px;color:var(--text-3)}

.search-box{padding:6px 14px 8px;position:relative}
.search-box input{
  width:100%;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  font-size:13px;outline:none;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-results{
  position:absolute;left:14px;right:14px;top:46px;max-height:62vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 30px -12px rgba(16,24,40,.3);padding:6px;z-index:50;
}
.search-results .sr-item{display:block;padding:7px 9px;border-radius:7px;cursor:pointer}
.search-results .sr-item:hover{background:var(--accent-soft);text-decoration:none}
.search-results .sr-item b{display:block;font-size:13px;color:var(--text);font-weight:600}
.search-results .sr-item span{font-size:11.5px;color:var(--text-3)}
.search-results .sr-empty{padding:10px;font-size:12.5px;color:var(--text-3)}

.tree{flex:1;overflow-y:auto;padding:4px 10px 20px}
.tree-ch{margin-bottom:2px}
.tree-ch > button{
  width:100%;display:flex;align-items:center;gap:8px;
  background:none;border:0;padding:9px 8px;border-radius:8px;
  color:var(--text);font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;
}
.tree-ch > button:hover{background:var(--panel-2)}
.tree-ch.open > button .caret{transform:rotate(90deg)}
.caret{font-size:10px;color:var(--text-3);transition:transform .15s;display:inline-block}
.ch-no{
  font-size:10.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 5px;
}
.tree-sec{padding:2px 0 2px 14px}
.tree-sec > .sec-label{
  font-size:11.5px;color:var(--text-3);padding:7px 8px 3px;
  letter-spacing:.03em;
}
.tree-topic{
  display:flex;align-items:center;gap:6px;
  padding:5.5px 8px;border-radius:7px;font-size:13px;color:var(--text-2);
  cursor:pointer;line-height:1.45;
}
.tree-topic:hover{background:var(--panel-2);color:var(--text);text-decoration:none}
.tree-topic.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree-topic .dot{
  width:5px;height:5px;flex:0 0 5px;border-radius:50%;background:var(--line);
}
.tree-topic.active .dot{background:var(--accent)}
.tree-topic.done .dot{background:var(--ok)}
.tree-hidden{display:none}

.sidebar-foot{
  border-top:1px solid var(--line);padding:10px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
}
.ghost-btn{
  background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);
  padding:7px 4px;border-radius:8px;font-size:12px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------------- 主区 ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:11px 26px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:blur(8px);
}
.icon-btn{
  display:none;background:none;border:1px solid var(--line);color:var(--text);
  border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;
}
.crumb{flex:1;min-width:0;font-size:12.5px;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--text-2);font-weight:500}
.progress-mini{font-size:12px;color:var(--text-3);white-space:nowrap}
.progress-mini .bar{
  display:inline-block;width:74px;height:5px;border-radius:3px;
  background:var(--line);vertical-align:middle;margin-left:7px;overflow:hidden;position:relative;
}
.progress-mini .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}

.article{max-width:920px;width:100%;margin:0 auto;padding:30px 26px 90px}

/* ---------------- 首页 ---------------- */
.hero{margin-bottom:26px}
.hero h1{font-size:27px;line-height:1.35;margin:0 0 10px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--text-2);font-size:14.5px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 26px}
.stat{
  flex:1 1 120px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);
}
.stat b{display:block;font-size:23px;line-height:1.2;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--text-3)}

.stack-label{
  font-size:12px;color:var(--text-3);letter-spacing:.08em;
  margin:26px 0 12px;text-transform:uppercase;
}
.flow{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--panel-2);border:1px dashed var(--line);
  border-radius:var(--radius);padding:12px 14px;font-size:13px;color:var(--text-2);
}
.flow em{font-style:normal;color:var(--accent-2);font-weight:600}
.flow .arrow{color:var(--text-3)}

.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.ch-grid{grid-template-columns:1fr}}
.ch-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 18px;box-shadow:var(--shadow);cursor:pointer;
  transition:border-color .15s, transform .15s;
}
.ch-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.ch-card .ch-head{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.ch-card h3{margin:0;font-size:16px}
.ch-card .ch-sub{font-size:12.5px;color:var(--text-3);margin:0 0 10px}
.ch-card .ch-secs{display:flex;flex-wrap:wrap;gap:6px}
.ch-card .chip{
  font-size:11.5px;color:var(--text-2);background:var(--panel-2);
  border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;
}
.ch-card .ch-meta{margin-top:11px;font-size:11.5px;color:var(--text-3);
  display:flex;justify-content:space-between;align-items:center}
.ch-card .ch-meta .go{color:var(--accent);font-weight:600}

/* ---------------- 章页 / 卡片列表 ---------------- */
.page-head{margin-bottom:22px}
.page-head .kicker{font-size:12px;color:var(--accent);letter-spacing:.1em;font-weight:700}
.page-head h1{font-size:24px;margin:6px 0 8px;line-height:1.35}
.page-head p{margin:0;color:var(--text-2);font-size:14px}

.sec-block{margin-bottom:28px}
.sec-block > h2{
  font-size:13px;color:var(--text-3);font-weight:600;letter-spacing:.05em;
  margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line-2);
}
.topic-card{
  display:block;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:13px 16px;margin-bottom:9px;cursor:pointer;
  box-shadow:var(--shadow);
}
.topic-card:hover{border-color:var(--accent);text-decoration:none}
.topic-card .tc-top{display:flex;gap:9px;align-items:baseline}
.topic-card .tc-idx{font-size:11px;color:var(--text-3);min-width:16px}
.topic-card h4{margin:0;font-size:15px;color:var(--text)}
.topic-card .tc-sub{font-size:12.5px;color:var(--text-3);margin:3px 0 0 25px}
.topic-card .tc-key{
  font-size:13px;color:var(--text-2);margin:7px 0 0 25px;
  padding-left:10px;border-left:2px solid var(--accent-soft);
}
.topic-card.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}

/* ---------------- 知识点页 ---------------- */
.topic-head{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.topic-head .kicker{font-size:12px;color:var(--text-3)}
.topic-head h1{font-size:25px;margin:7px 0 6px;line-height:1.35;letter-spacing:-.01em}
.topic-head .sub{color:var(--text-2);font-size:14px;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{
  font-size:11.5px;background:var(--accent-soft);color:var(--accent);
  border-radius:6px;padding:2px 8px;cursor:default;
}
.topic-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text-2);
  padding:6px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;
}
.act-btn:hover{border-color:var(--accent);color:var(--accent)}
.act-btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}

/* 阅读区排版 */
.md h2{
  font-size:17px;margin:30px 0 12px;padding-left:11px;
  border-left:3px solid var(--accent);line-height:1.5;
}
.md h3{font-size:15px;margin:20px 0 8px;color:var(--text)}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0;padding-left:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--accent)}
.md strong{font-weight:700}
.md em{font-style:normal;color:var(--accent-2)}
.md mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 3px;font-weight:600}
.md code{
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;
  padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;
}
.md a.tlink{
  border-bottom:1px dashed var(--accent-2);color:var(--accent-2);
  padding-bottom:1px;
}
.md hr{border:0;border-top:1px dashed var(--line);margin:24px 0}
.md pre{
  margin:12px 0;padding:12px 15px;background:var(--panel-2);
  border:1px solid var(--line-2);border-left:3px solid var(--accent);
  border-radius:8px;overflow-x:auto;
}
.md pre code{
  background:none;border:0;padding:0;font-size:13px;line-height:1.9;
  font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;white-space:pre;
}
.md blockquote{
  margin:13px 0;padding:11px 15px;background:var(--panel-2);
  border-left:3px solid var(--accent-2);border-radius:0 8px 8px 0;
  color:var(--text-2);font-size:14px;
}
.md blockquote p{margin:4px 0}
.md blockquote.tip{background:var(--warn-soft);border-left-color:var(--warn)}
.md .tbl{
  margin:14px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.md table{
  width:100%;border-collapse:collapse;font-size:13.5px;
}
@media (max-width:720px){.md .tbl table{min-width:560px}}
.md table th,.md table td{
  border-bottom:1px solid var(--line-2);padding:8px 11px;text-align:left;vertical-align:top;
}
.md table th{background:var(--panel-2);font-weight:600;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.md table tr:last-child td{border-bottom:0}
.md details{
  margin:10px 0;border:1px solid var(--line);border-radius:9px;background:var(--panel);
  padding:10px 14px;
}
.md details summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text)}
.md details summary::marker{color:var(--accent)}
.md details[open] summary{margin-bottom:7px;padding-bottom:7px;border-bottom:1px dashed var(--line-2)}
.md details .ans{font-size:13.5px;color:var(--text-2)}
.md details .ans p{margin:5px 0}

.pager{display:flex;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;font-size:13px;color:var(--text-2);box-shadow:var(--shadow);
}
.pager a:hover{border-color:var(--accent);text-decoration:none;color:var(--accent)}
.pager a span{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px}
.pager a.next{text-align:right}

/* ---------------- 闪卡 ---------------- */
.card-stage{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:34px 26px;min-height:210px;display:flex;flex-direction:column;
  justify-content:center;box-shadow:var(--shadow);margin-bottom:16px;
}
.card-stage .q{font-size:17px;line-height:1.7;font-weight:600}
.card-stage .a{
  margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);
  font-size:14.5px;color:var(--text-2);
}
.card-stage .a.hidden{display:none}
.card-stage .src{margin-top:14px;font-size:11.5px;color:var(--text-3)}
.card-bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.card-bar .act-btn{padding:8px 16px}

/* ---------------- 杂项 ---------------- */
.empty{padding:40px 0;text-align:center;color:var(--text-3);font-size:13.5px}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--bg);font-size:12.5px;padding:8px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99;
}
.toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}
kbd{
  background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:0 5px;font-size:11.5px;font-family:inherit;
}

/* 移动端 */
@media (max-width:940px){
  .sidebar{
    position:fixed;left:0;top:0;transform:translateX(-100%);
    transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2);
  }
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open::after{
    content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;
  }
  .icon-btn{display:block}
  .topbar{padding:10px 16px}
  .article{padding:22px 16px 80px}
  .hero h1{font-size:22px}
}

/* 手机竖屏（≤560px）再收一档 */
@media (max-width:560px){
  .article{padding:18px 14px 72px}
  .hero h1{font-size:20px}
  .hero p{font-size:13.5px}
  .stats{gap:8px}
  .stat{flex:1 1 calc(50% - 4px);padding:11px 13px}
  .stat b{font-size:20px}
  .flow{font-size:12.5px;padding:10px 12px}
  .progress-mini .bar{display:none}
  .ch-grid{gap:10px}
  .ch-card{padding:14px 15px}
  .topic-head h1{font-size:21px}
  .md h2{font-size:16px;margin:20px 0 8px}
  .md table{font-size:12.5px}
  .md table th,.md table td{padding:6px 8px}
  .card-stage{padding:16px}
  .pager a.next{display:block;text-align:left}
}

</style>
</head>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <!-- 网站名字由 data/manifest.js 的 site 字段决定，这里只是默认字样 -->
    <div class="brand">
      <div class="brand-mark" id="brandMark">C</div>
      <div class="brand-text">
        <strong id="brandName">cmcL02</strong>
        <span id="brandSub">框架 → 细分 → 自测</span>
      </div>
    </div>

    <div class="search-box">
      <input id="searchInput" type="search" placeholder="搜索药名 / 概念   按 /" autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>

    <nav class="tree" id="tree"></nav>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="btnCards">闪卡自测</button>
      <button class="ghost-btn" id="btnHelp">如何增改</button>
      <button class="ghost-btn" id="btnTheme">深浅色</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="btnMenu" aria-label="目录">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="progress-mini" id="progressMini"></div>
    </div>
    <article class="article" id="article"></article>
  </main>

</div>

<script>
/* ============================================================
   md.js —— 极简 markdown 渲染器（不依赖任何外部库）
   支持：## / ### 标题、- 列表、1. 有序列表、表格、
        > 引用（口诀自动高亮）、--- 分隔线、**粗体**、
        `代码`、==高亮==、[[知识点id|文字]] 内链、
        :::quiz 题干 / 答案 / ::: （折叠自测）
   ============================================================ */
(function () {
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---------- 行内 ----------
  function inline(s) {
    s = esc(s);
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    // 内部链接 [[topic-id]] 或 [[topic-id|显示文字]]
    s = s.replace(/\[\[([^\[\]|]+)(?:\|([^\[\]]+))?\]\]/g, function (_, id, label) {
      var t = id.trim();
      return '<a class="tlink" href="#/t/' + t + '">' + (label ? label.trim() : t) + '</a>';
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) {
      return '<code>' + codes[+i] + '</code>';
    });
    return s;
  }

  function isTableSep(line) {
    return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf('-') > -1;
  }

  function splitRow(line) {
    var s = line.trim();
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
    // 保护 [[id|文字]] 内部的竖线，避免被当成单元格分隔符
    var links = [];
    s = s.replace(/\[\[[^\]]+\]\]/g, function (m) {
      links.push(m);
      return '\u0001' + (links.length - 1) + '\u0001';
    });
    return s.split('|').map(function (c) {
      return c.trim().replace(/\u0001(\d+)\u0001/g, function (_, i) {
        return links[+i];
      });
    });
  }

  var BLOCK_START = /^(#{2,3}\s|[-*]\s|\d+\.\s|\||>\s?|---+\s*$|:::quiz|```)/;

  // ---------- 主渲染 ----------
  function render(src) {
    var lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];
      var t = line.trim();

      if (t === '') { i++; continue; }

      // :::quiz 题干
      if (/^:::quiz/.test(t)) {
        var q = t.replace(/^:::quiz\s*/, '');
        var ans = [];
        i++;
        while (i < lines.length && lines[i].trim() !== ':::') { ans.push(lines[i]); i++; }
        i++; // 跳过 :::
        out.push(
          '<details><summary>' + inline(q) + '</summary><div class="ans">' +
          render(ans.join('\n')) + '</div></details>'
        );
        continue;
      }

      // 代码块（公式常用）
      if (/^```/.test(t)) {
        var cb = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i].trim())) { cb.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + esc(cb.join('\n')) + '</code></pre>');
        continue;
      }

      // 标题
      if (/^###\s/.test(t)) { out.push('<h3>' + inline(t.slice(4)) + '</h3>'); i++; continue; }
      if (/^##\s/.test(t)) {
        out.push('<h2>' + inline(t.replace(/^##\s+/, '')) + '</h2>');
        i++; continue;
      }

      // 分隔线
      if (/^---+\s*$/.test(t)) { out.push('<hr>'); i++; continue; }

      // 表格
      if (t.charAt(0) === '|' && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = splitRow(t);
        i += 2;
        var body = [];
        while (i < lines.length && lines[i].trim().charAt(0) === '|') {
          body.push(splitRow(lines[i]));
          i++;
        }
        var h = '<table><thead><tr>' + head.map(function (c) {
          return '<th>' + inline(c) + '</th>';
        }).join('') + '</tr></thead><tbody>';
        h += body.map(function (r) {
          return '<tr>' + head.map(function (_, k) {
            return '<td>' + inline(r[k] == null ? '' : r[k]) + '</td>';
          }).join('') + '</tr>';
        }).join('');
        out.push('<div class="tbl">' + h + '</tbody></table></div>');
        continue;
      }

      // 引用
      if (/^>/.test(t)) {
        var buf = [];
        while (i < lines.length && /^>/.test(lines[i].trim())) {
          buf.push(lines[i].trim().replace(/^>\s?/, ''));
          i++;
        }
        var raw = buf.join(' ');
        var cls = /口诀|速记|记忆|一句话|重点/.test(raw) ? ' class="tip"' : '';
        out.push('<blockquote' + cls + '>' + render(buf.join('\n')) + '</blockquote>');
        continue;
      }

      // 无序列表
      if (/^[-*]\s/.test(t)) {
        var ul = [];
        while (i < lines.length && /^[-*]\s/.test(lines[i].trim())) {
          ul.push(lines[i].trim().replace(/^[-*]\s+/, ''));
          i++;
        }
        out.push('<ul>' + ul.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>');
        continue;
      }

      // 有序列表
      if (/^\d+\.\s/.test(t)) {
        var ol = [];
        while (i < lines.length && /^\d+\.\s/.test(lines[i].trim())) {
          ol.push(lines[i].trim().replace(/^\d+\.\s+/, ''));
          i++;
        }
        out.push('<ol>' + ol.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ol>');
        continue;
      }

      // 段落
      var para = [];
      while (i < lines.length && lines[i].trim() !== '' && !(para.length && BLOCK_START.test(lines[i].trim()))) {
        para.push(lines[i].trim());
        i++;
      }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }

  // ---------- 抽取自测题（用于闪卡） ----------
  function extractQuizzes(src) {
    var res = [];
    var re = /^:::quiz\s*([^\n]*)\n([\s\S]*?)\n:::\s*$/gm;
    var m;
    while ((m = re.exec(String(src || '').replace(/\r\n?/g, '\n')))) {
      res.push({ q: m[1].trim(), a: m[2].trim() });
    }
    return res;
  }

  // ---------- 纯文本（用于搜索索引/摘要） ----------
  function plain(src) {
    return String(src || '')
      .replace(/^:::quiz\s*/gm, '')
      .replace(/^:::\s*$/gm, '')
      .replace(/\[\[([^\[\]|]+)\|([^\[\]]+)\]\]/g, '$2')
      .replace(/\[\[([^\[\]]+)\]\]/g, '$1')
      .replace(/[#>*`|=]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  window.MD = { render: render, inline: inline, extractQuizzes: extractQuizzes, plain: plain };
})();

## 药物的基本作用：只有「调节」，没有「创造」
药物**不能使机体产生新的功能**，只能把机体固有的功能**增强（兴奋）或减弱（抑制）**。

1. 兴奋与抑制的比较标准是**机体原有的机能状态**；
2. 药物不能产生新功能；
3. 兴奋与抑制在一定条件下**可相互转化**（如中枢兴奋药过量→惊厥→抑制）；
4. 同一药物对不同器官可产生**不同的调节作用**。

## 作用方式（4 个概念，两两成对）
| 作用方式 | 含义 | 举例 |
| --- | --- | --- |

| 直接作用（原发） | 对**与之接触**的部位产生的作用 | 强心苷直接作用于心脏 |
| 间接作用（继发） | 对**非与之接触**的部位产生的作用 | 强心苷强心→尿量增加 |

> 思考题：作用方式与给药途径**有关**吗？——局部/吸收作用与给药途径直接相关；直接/间接作用则不一定。

## 选择性
定义：适当剂量下药物只对机体**少数组织器官**产生明显作用，对其他组织器官影响很小。

| 类型 | 定义 | 关键特点 |
| --- | --- | --- |
| **副作用** | 治疗剂量下出现的、与治疗无关的作用 | 选择性低所致；发生率高、危害小；**可预知、无法避免**；可与治疗作用互相转化 |
| **毒性反应** | 剂量过大/时间过长/机体高敏时出现 | 危害大，有急慢性之分；**可预知、可避免** |
| **后遗效应** | 停药后血药浓度已降至阈浓度以下仍残存的效应 | 是原有药理作用的延续（如苯巴比妥次晨"宿醉"） |
| **继发反应** | 治疗作用本身带来的不良后果（治疗矛盾） | 如四环素→二重感染（鹅口疮） |

| 类型 | 定义 | 关键特点 |
| --- | --- | --- |
| **变态反应**（过敏） | 药物或其代谢物/杂质作为抗原或半抗原引起的病理性免疫反应 | **与剂量、药理作用无关**；药理性拮抗剂**无效**；再用可反复发生；难预测 |
| **特异质反应** | 遗传异常导致的特殊反应 | 仅见于特异体质者；**与剂量成正比**；药理性拮抗剂**有效**；有家族性、终身性 |

### C. 与长期用药相关
| 类型 | 定义 | 关键特点 |
| --- | --- | --- |
| **耐受性** | 连续用药后机体对药物**反应性降低** | 增加剂量可（或不可）克服 |
| **耐药性** | 长期用化疗药后**病原体/肿瘤细胞**敏感性降低 | 对象是病原体，不是人体 |

| --- | --- |

| 最小致死量 MLC | 刚引起死亡的剂量 |

## pKa 的定义（最容易被绕晕）
**pKa = 药物解离 50% 时所在溶液的 pH**，反映药物的离子化能力。
- pKa 与药物本身是弱酸还是弱碱**无关**：弱酸药的 pKa 可以 >7，弱碱药的 pKa 可以 <7；
- 弱酸性药：**pKa 越大，酸性越弱**；
- 弱碱性药：**pKa 越大，碱性越强**。

## Henderson-Hasselbalch 公式
\`\`\`
弱酸药：pH − pKa = lg([A⁻]/[HA])     10^(pH−pKa) = [离子型]/[分子型]
弱碱药：pKa − pH = lg([BH⁺]/[B])     10^(pKa−pH) = [离子型]/[分子型]
\`\`\`

**离子障**：解离型（离子型）带电荷，脂溶性极低，难以通过简单扩散透过生物膜。体液 pH 稍有变化，解离度就呈**指数**变化。

## 两个必考实例
**① 阿司匹林（弱酸，pKa 3.5）为什么胃里吸收快、肠里吸收少？**
- 胃 pH≈1.5 ≪ pKa 3.5 → 分子型占绝对优势（>99%）→ 脂溶性高，易穿透胃黏膜 → 吸收快；
- 肠液 pH≈6.5 > pKa → 离子型占优势 → 难以穿透肠黏膜 → 吸收率大大降低。

**② 巴比妥类中毒为什么要碱化尿液？**
- 苯巴比妥为弱酸，pKa≈7.4；
- 酸性尿（pH 5.0）：分子型为主 → 肾小管**重吸收**多 → 排泄慢；
- 碱性尿（pH 8.0）：离子型为主 → 不能被重吸收 → 随尿排出；
- 临床：静注碳酸氢钠碱化尿液，是巴比妥中毒急救的重要措施。

> 口诀：**「分子型易吸收，离子型易排泄」**。另有传统说法「酸酸碱碱促吸收，碱酸酸碱促排泄」——意思是酸性药在酸性环境吸收多、碱性药在碱性环境吸收多；要想加速弱酸药排泄就碱化尿液，加速弱碱药排泄就酸化尿液。

## 对比表（必背）
| 项目 | 一级动力学 | 零级动力学 |
| --- | --- | --- |
| 发生条件 | 药量较少、**未达饱和**（多数药治疗量属此类） | 药量过多、**酶或载体已饱和** |

| 例子 | 大多数药物在治疗量 | 苯妥英钠、阿司匹林、乙醇在大剂量时 |

:::quiz 一级与零级消除动力学的核心区别是什么？哪一种药物剂量稍增易蓄积中毒？

**零级**动力学药物（苯妥英钠、大剂量阿司匹林、乙醇）剂量稍增即超出酶饱和能力，消除时间骤增 → 易蓄积中毒。

血浆药物浓度下降**一半**所需时间（一级动力学时才恒定）。

| --- | --- | --- |

\`\`\`

    md: `## 共同机制
抑制胆碱酯酶 → 突触间隙 Ach 不能被水解而**堆积** → 产生**全部 M 样 + N 样作用**（间接拟胆碱）。

## 两大类
| 类型 | 代表 | 与 ChE 的结合 |
| --- | --- | --- |
| **易逆性**（临床常用） | 新斯的明、毒扁豆碱、吡啶斯的明 | 可逆，作用维持数小时 |
| **难逆性**（毒物） | **有机磷酸酯** | 磷酰化后"老化"，不可逆，见 [[ch3-ophos|有机磷中毒]] |

## 新斯的明（重点）
**三重机制**：
1. 抑制 ChE，Ach 堆积（主要）；
2. **直接激动骨骼肌运动终板 N₂ 受体**；
3. 促进运动神经末梢释放 Ach。

**作用选择性**：**骨骼肌 > 胃肠、膀胱平滑肌 > 腺体、眼、心血管**（这是它与毒扁豆碱最大的差别）。

**临床应用**：
- **重症肌无力**（对症治疗首选之一，注意过量可致"胆碱能危象"反而肌无力加重）；
- 术后**肠胀气、尿潴留**；
- 解救**阿托品中毒**；
- 阵发性室上性心动过速；
- 解救**非去极化肌松药**（筒箭毒碱）中毒。

**禁忌**：机械性肠梗阻、尿路梗阻、支气管哮喘（M 样作用会加重痉挛）。

## 毒扁豆碱（依色林）
- 叔胺类，**脂溶性高**，易透过血脑屏障与角膜；
- 对眼的缩瞳、降眼压作用**强于毛果芸香碱**，但**刺激性强**、易致结膜充血；
- 可用于中药麻醉的**催醒**（易入中枢）。

## 中枢抗 ChE 药（治阿尔茨海默病 AD）
- **他克林**（第一代）：肝毒性大、ALT 升高，限制应用；
- **多奈哌齐**（第二代）：长效、高选择性、耐受性好，为 AD 常用药。

:::quiz 新斯的明为什么对骨骼肌作用最强？它的禁忌证有哪些？
**机制三合一**：① 抑制 ChE 使 Ach 堆积；② **直接激动运动终板 N₂ 受体**；③ 促进运动神经末梢释放 Ach。三者都直接作用于神经肌接头，故对骨骼肌作用最强。
**禁忌**：机械性肠梗阻、尿路梗阻（M 样作用使平滑肌收缩加重梗阻）、支气管哮喘（可致支气管痉挛）。
:::`

    md: `## 中毒途径与机制
有机磷酸酯（敌敌畏、对硫磷等）**脂溶性高**，可经皮肤、呼吸道、消化道吸收；与 ChE 结合形成**磷酰化 ChE**，使酶失活；久则"**老化**"而不可复活。

## 中毒表现（三组症状，按顺序出现）
**① M 样症状（最早、最突出）**
- 眼：瞳孔缩小、视力模糊、眼痛；
- 腺体：流涎、流泪、流涕、**大汗**；
- 呼吸：呼吸道分泌物增多、**肺湿啰音**、呼吸困难（**最主要的死因之一是呼吸衰竭**）；
- 胃肠：恶心、呕吐、腹痛、腹泻、大小便失禁；
- 心血管：心率减慢、血压下降。

**② N 样症状**：肌束颤动、抽搐，进而肌无力、**呼吸肌麻痹**。

**③ 中枢症状**：先兴奋（烦躁、头痛、头晕），后抑制（昏迷、呼吸抑制、循环衰竭）。

> 轻、中、重度中毒就是这三组的组合：轻度以 M 样为主，中度伴 N 样，重度出现中枢症状与呼吸循环衰竭。

## 解救原则（两步走）
1. **清除毒物**：脱离现场、洗胃、导泻、皮肤清洗；
2. **解毒药联合应用**：
   - **阿托品**：迅速解除 **M 样症状**（呼吸道分泌物、支气管痉挛、心动过缓）——**早期、足量、反复、维持**，达到"阿托品化"（瞳孔散大、口干、皮肤干燥、心率加快、肺部啰音消失）；
   - **胆碱酯酶复活药**（碘解磷定、氯解磷定）：恢复 ChE 活性，主要改善 **N 样症状与中枢症状**——**早期、适量**使用。

## 复活药机制
- 与磷酰化 ChE 结合，使酶游离复活；
- 与游离的有机磷结合成无毒物排出。
- 局限：对**已老化**的磷酰化 ChE **无效**；剂量过大反而**抑制 ChE**、阻滞神经肌接头；中度以上中毒须**与阿托品合用**。

> 一句话记：**阿托品打 M，复活剂救酶（N 与中枢），两者必须合用。**

:::quiz 有机磷中毒时阿托品与胆碱酯酶复活药各解决什么问题？为什么必须合用？
**阿托品**阻断 M 受体，迅速缓解 M 样症状（呼吸道分泌物多、支气管痉挛、心动过缓、瞳孔缩小），但不能复活 ChE，对 N 样症状（肌颤、呼吸肌麻痹）无效。
**复活药**（碘/氯解磷定）使磷酰化 ChE 复活，主要改善 N 样与中枢症状，但对老化酶无效、起效较慢。
两者作用环节互补，故中重度中毒必须**联合**并同时清除毒物。
:::`
  },

    title: "抗帕金森病药",
    subtitle: "恢复 DA/Ach 平衡 · L-DOPA 与苯海索",

    key: "黑质纹状体 DA↓、Ach 相对↑ → 补 DA 或抗胆碱，两条路都通向同一个平衡。",
    md: `## 病理基础（先懂这个，药就好记）
黑质—纹状体**多巴胺能神经元变性** → DA 减少 → Ach 能相对亢进 → **DA/Ach 失衡** → 锥体外系症状（震颤、肌强直、运动迟缓）。

> 因此治疗只有两条路：**补 DA**（拟多巴胺药）或**削 Ach**（中枢抗胆碱药）。

## 药物分类
| 类别 | 代表药 | 作用 |
| --- | --- | --- |
| 多巴胺前体 | **L-DOPA（左旋多巴）** | 透过血脑屏障后脱羧成 DA |
| 外周脱羧酶抑制剂 | **卡比多巴、苄丝肼** | 只在外周抑制脱羧，增加入脑量 |
| DA 受体激动药 | 溴隐亭、普拉克索 | 直接激动 D 受体 |
| 促 DA 释放药 | **金刚烷胺** | 促释放 + 弱抗胆碱 |
| MAO-B 抑制剂 | 司来吉兰 | 减少 DA 降解 |
| COMT 抑制剂 | 硝替卡朋、托卡朋、恩他卡朋 | 减少外周 DA 降解 |
| 中枢抗胆碱药 | **苯海索（安坦）** | 阻断纹状体 M 受体，削 Ach |

## L-DOPA（左旋多巴）
- 本身无活性，经**氨基酸转运载体**快速吸收，**透过血脑屏障后**被脱羧成 DA 才起效；
- 外周可被**多巴脱羧酶**变成 DA（引起外周副作用）、被 **COMT** 变成 3-OMD；
- **用途**：各种帕金森病（**抗精神病药引起的帕金森综合征除外**，因那是受体被阻断，补 DA 无效）；抗肝昏迷（补充中枢递质）；
- **不良反应**：
  - 早期（外周 DA 所致）：恶心呕吐、食欲减退、心律失常、**体位性低血压**；
  - 长期：**不自主异常运动**、**症状波动（"开—关"现象）**、精神症状；
- **增效策略**：合用**卡比多巴/苄丝肼**（外周脱羧酶抑制剂，不让 L-DOPA 在外周浪费，同时减少外周副作用）是最经典组合。

## 苯海索（安坦）
- 中枢抗胆碱药，阻断纹状体 M 受体，**削 Ach**；
- 对**震颤**效果好，对肌强直、运动迟缓较差；
- 用于：轻症、不能耐受 L-DOPA 者、**抗精神病药引起的帕金森综合征**（此时抗胆碱药有效而 L-DOPA 无效）。

:::quiz 为什么 L-DOPA 要与卡比多巴合用？抗精神病药引起的帕金森综合征为什么用苯海索而不用 L-DOPA？
**合用卡比多巴**：卡比多巴是**外周**脱羧酶抑制剂，不易入脑，可阻止 L-DOPA 在外周脱羧变成 DA，使更多 L-DOPA 进入中枢，既**增强疗效**又**减少外周副作用**。
**抗精神病药**所致帕金森综合征是 D₂ 受体被阻断、Ach 相对亢进所致，补充 DA 无靶点可用；此时用**中枢抗胆碱药（苯海索）**削 Ach 才对症。
:::`

## BZ 的优点（简答常考）
1. **抗焦虑作用显著**，且在小于镇静剂量时即出现（巴比妥类无此特性）；
2. **安全性好、治疗指数高**：无麻醉作用，对呼吸影响小，不易致死；
3. 对 **REMS 影响小**，停药反跳轻，依赖性与成瘾性较巴比妥类小。

## 巴比妥类
**用途**：镇静、催眠、抗惊厥、抗癫痫（苯巴比妥长效，可用于癫痫大发作）；**硫喷妥钠**作静脉麻醉/诱导麻醉。
**缺点**：
- 对 REMS 影响**大** → 停药反跳、易耐受、依赖与戒断明显；
- 不良反应多，过量中毒严重（麻醉、呼吸抑制）；
- **诱导肝药酶**，干扰其他药物代谢（如使抗凝药失效）。

**急性中毒救治**：
1. **高锰酸钾溶液洗胃**（1:5000）；
2. **硫酸钠导泻**（**不用硫酸镁**，因 Mg²⁺ 可被吸收加重中枢抑制）；
3. 输液、**碱化体液及尿液**（碳酸氢钠）→ 加速排泄；
4. 必要时血液透析；
5. 死因多为**呼吸衰竭**（必要时人工呼吸、给氧）。

## BZ 与巴比妥类对比表
| 项目 | BZ | 巴比妥类 |
| --- | --- | --- |
| 对 REMS 影响 | + | +++ |
| 后遗作用 | + | ++ |
| 麻醉作用 | 无 | **有** |
| 中枢性肌松 | ++ | − |
| 安全范围（治疗指数） | **大** | 较小 |
| 依赖性 | 轻 | 较大 |
| 肝药酶诱导 | − | ++ |
| 特异解毒药 | **氟马西尼** | 无（对症+碱化尿液） |

:::quiz 巴比妥类急性中毒为什么用硫酸钠而不用硫酸镁导泻？
硫酸镁中的 Mg²⁺ 在肠道可被少量吸收，而**镁离子本身有中枢抑制和呼吸抑制作用**；巴比妥类中毒者中枢已处于深度抑制状态，再用硫酸镁会**加重呼吸抑制**。
硫酸钠不被吸收，只起渗透性导泻作用，安全，故中毒时选用硫酸钠。
:::`

**中枢**：

2. **抗精神病**：对**Ⅰ型（阳性症状）急性精神分裂症**效果好，需长期用药；
3. **镇吐**：除**晕动病/前庭性呕吐**外的各种呕吐，也治顽固性呃逆（晕动病用东莨菪碱）；
4. **抑制体温调节中枢**：使体温随环境温度下降 → **人工冬眠、低温麻醉**；**冬眠合剂 = 氯丙嗪 + 异丙嗪 + 哌替啶**；
5. 增强其他中枢抑制药的作用。

**植物神经**：阻断 α 受体 + 抑制血管运动中枢 → 血压下降、**体位性低血压**；外周抗胆碱较弱 → 口干、便秘、视力模糊。
**内分泌**：见上表（催乳素↑、生长激素↓可用于巨人症、性腺与肾上腺皮质功能↓、皮肤色素沉着）。

## 不良反应
- 常见：嗜睡、乏力、情感淡漠；M 阻断症状；α 阻断（鼻塞、体位性低血压）；局部刺激（**深部肌注**）；
- **锥体外系反应**（最突出）：
  - **急性运动障碍**：帕金森综合征、**静坐不能**、急性肌张力障碍 —— 因黑质—纹状体 D₂ 被阻断、Ach 相对亢进 → 可用**中枢抗胆碱药（苯海索）**缓解；
  - **迟发性运动障碍**：长期用药后 DA 受体**上调**，停药后出现，**中枢抗胆碱药反而加重**；
- 其他：内分泌紊乱、诱发精神障碍、诱发惊厥癫痫、过敏、急性中毒。

> 一句话总结：**一个氯丙嗪 = 阻断 D₂（抗精神病、镇吐、抑体温、内分泌、锥体外系）+ 阻断 α（镇静、降压）+ 阻断 M（阿托品样）。**

:::quiz 氯丙嗪的锥体外系反应由哪条 DA 通路被阻断引起？为什么用苯海索有效，而迟发性运动障碍却不能用？
**黑质—纹状体**通路的 D₂ 受体被阻断 → 该处 DA 功能下降、**Ach 相对亢进** → 出现帕金森综合征、静坐不能、急性肌张力障碍。
**苯海索有效**：它是中枢抗胆碱药，阻断 M 受体、削弱相对亢进的胆碱能功能，恢复 DA/Ach 平衡。
**迟发性运动障碍不能用**：其机制是长期阻断后 DA 受体**上调**、DA 功能相对过强，再用抗胆碱药会进一步加重症状。
:::`

<script>
/* ============================================================
   app.js —— 路由 / 渲染 / 搜索 / 进度 / 闪卡
   （一般不用改这个文件；改内容请编辑 data/ 下的章节文件）

(function () {
  'use strict';

  var P = window.PHARM || { chapters: [] };
  var MD = window.MD;

  // 章的顺序由各章文件里的 order 字段决定
  P.chapters.sort(function (a, b) { return (a.order || 99) - (b.order || 99); });

  /* ---------------- 网站名字（改 data/manifest.js 的 site 字段） ---------------- */
  var SITE = P.site || {};
  var SITE_NAME = SITE.name || '药理学 · 学习地图';
  var SITE_HERO = SITE.hero || SITE_NAME;

  function applySite() {
    document.title = SITE_NAME;
    var m = document.getElementById('brandMark');
    var n = document.getElementById('brandName');
    var s = document.getElementById('brandSub');
    if (m && SITE.mark) m.textContent = SITE.mark;
    if (n) n.textContent = SITE_NAME;
    if (s && SITE.sub) s.textContent = SITE.sub;
  }
  applySite();

  var article = document.getElementById('article');
  var treeEl = document.getElementById('tree');
  var crumbEl = document.getElementById('crumb');
  var progEl = document.getElementById('progressMini');
  var searchInput = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');

  /* ---------------- 本地存储 ---------------- */
  function load(key, def) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch (e) { return def; }
  }
  function save(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
  }

  var state = {
    done: load('pharm.done', []),
    theme: load('pharm.theme', 'light'),
    open: load('pharm.open', { ch1: true })
  };

  /* ---------------- 建立索引 ---------------- */
  var topics = [];
  var byId = {};
  P.chapters.forEach(function (ch) {
    ch._sections = (ch.topics || []).map(function (t) { return t.section || '正文'; });
    (ch.topics || []).forEach(function (t, i) {
      t._ch = ch;
      t._idx = i + 1;
      topics.push(t);
      byId[t.id] = t;
    });
  });

  // 每章的分节顺序（去重保序）
  P.chapters.forEach(function (ch) {
    var seen = {}, order = [];
    (ch.topics || []).forEach(function (t) {
      var s = t.section || '正文';
      if (!seen[s]) { seen[s] = 1; order.push(s); }
    });
    ch._sectionOrder = order;
  });

  var totalTopics = topics.length;
  var isDone = function (id) { return state.done.indexOf(id) > -1; };

  /* ---------------- 小工具 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function toast(msg) {
    var el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }
  function percent() {
    if (!totalTopics) return 0;
    return Math.round(state.done.length / totalTopics * 100);
  }
  function quizCount() {
    var n = 0;
    topics.forEach(function (t) { n += MD.extractQuizzes(t.md).length; });
    return n;
  }
  var QUIZ_TOTAL = quizCount();

  /* ---------------- 主题 ---------------- */
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
  }
  applyTheme();

  /* ---------------- 侧边栏 ---------------- */
  function renderTree(activeTopicId) {
    var html = '';
    P.chapters.forEach(function (ch) {
      var open = !!state.open[ch.id];
      html += '<div class="tree-ch' + (open ? ' open' : '') + '">';
      html += '<button data-toggle-ch="' + ch.id + '"><span class="caret">▶</span>' +
              '<span class="ch-no">' + esc(ch.no || '') + '</span>' +
              '<span>' + esc(ch.title) + '</span></button>';
      html += '<div class="' + (open ? '' : 'tree-hidden') + '">';
      ch._sectionOrder.forEach(function (sec) {
        html += '<div class="tree-sec"><div class="sec-label">' + esc(sec) + '</div>';
        (ch.topics || []).forEach(function (t) {
          if ((t.section || '正文') !== sec) return;
          html += '<a class="tree-topic' + (t.id === activeTopicId ? ' active' : '') +
                  (isDone(t.id) ? ' done' : '') + '" href="#/t/' + t.id + '">' +
                  '<span class="dot"></span><span>' + esc(t.title) + '</span></a>';
        });
        html += '</div>';
      });
      html += '</div></div>';
    });
    treeEl.innerHTML = html;
  }

  function renderProgress() {
    progEl.innerHTML = '已掌握 ' + state.done.length + '/' + totalTopics +

  }

  /* ---------------- 首页 ---------------- */
  function viewHome() {

    h += '<div class="stats">' +
         '<div class="stat"><b>' + P.chapters.length + '</b><span>章 · 知识骨架</span></div>' +
         '<div class="stat"><b>' + totalTopics + '</b><span>个知识点</span></div>' +
         '<div class="stat"><b>' + QUIZ_TOTAL + '</b><span>道自测题</span></div>' +
         '<div class="stat"><b>' + percent() + '%</b><span>已掌握</span></div>' +
         '</div>';

    h += '<div class="stack-label">学习路线</div>';
    h += '<div class="flow">' +
         '<em>总论</em> 先立规则（药效学 · 药动学）' +
         '<span class="arrow">→</span>' +
         '<em>外周神经</em> 按递质分家（胆碱能 · 肾上腺素能）' +
         '<span class="arrow">→</span>' +
         '<em>中枢神经</em> 按靶点分家（抑制类药）' +
         '</div>';

    h += '<div class="stack-label">五大章</div><div class="ch-grid">';
    P.chapters.forEach(function (ch) {
      h += '<a class="ch-card" href="#/ch/' + ch.id + '">' +
           '<div class="ch-head"><span class="ch-no">' + esc(ch.no || '') + '</span>' +
           '<h3>' + esc(ch.title) + '</h3></div>' +
           '<p class="ch-sub">' + esc(ch.subtitle || '') + '</p>' +
           '<div class="ch-secs">' +
           ch._sectionOrder.map(function (s) {
             return '<span class="chip">' + esc(s) + '</span>';
           }).join('') +
           '</div>' +
           '<div class="ch-meta"><span>' + (ch.topics || []).length + ' 个知识点</span>' +
           '<span class="go">进入 →</span></div></a>';
    });
    h += '</div>';

    h += '<div class="stack-label">怎么用</div><div class="md">' + MD.render(
      '- **第一遍**：只看每章页的知识点标题和「一句话」，把骨架串起来，不要陷进细节。\n' +
      '- **第二遍**：点开知识点，看机制与对比表；表格是考试最爱出的地方。\n' +
      '- **第三遍**：翻到页底「考点自测」自己答，答对就点右上角**标记已掌握**，左下进度条会动。\n' +
      '- 复习时点左侧 **闪卡自测**，全部题随机抽。'
    ) + '</div>';

    return h;
  }

  /* ---------------- 章页 ---------------- */
  function viewChapter(ch) {
    crumbEl.innerHTML = '<b>' + esc(ch.title) + '</b>';
    var h = '<div class="page-head">' +
            '<div class="kicker">第 ' + esc(ch.no || '') + ' 章</div>' +
            '<h1>' + esc(ch.title) + '</h1>' +
            '<p>' + esc(ch.intro || ch.subtitle || '') + '</p></div>';

    ch._sectionOrder.forEach(function (sec) {
      h += '<div class="sec-block"><h2>' + esc(sec) + '</h2>';
      (ch.topics || []).forEach(function (t) {
        if ((t.section || '正文') !== sec) return;
        h += '<a class="topic-card' + (isDone(t.id) ? ' done' : '') + '" href="#/t/' + t.id + '">' +
             '<div class="tc-top"><span class="tc-idx">' + t._idx + '</span><h4>' + esc(t.title) + '</h4></div>' +
             (t.subtitle ? '<div class="tc-sub">' + esc(t.subtitle) + '</div>' : '') +

             '</a>';
      });
      h += '</div>';
    });
    return h;
  }

  /* ---------------- 知识点页 ---------------- */
  function viewTopic(t) {
    var ch = t._ch;
    crumbEl.innerHTML = '<b>' + esc(ch.title) + '</b> / ' + esc(t.section || '') + ' / ' + esc(t.title);

    var h = '<div class="topic-head">' +
            '<div class="kicker">' + esc(ch.title) + ' · ' + esc(t.section || '') + '</div>' +

            (t.subtitle ? '<p class="sub">' + esc(t.subtitle) + '</p>' : '');
    if (t.tags && t.tags.length) {
      h += '<div class="tags">' + t.tags.map(function (g) {

      }).join('') + '</div>';
    }
    h += '<div class="topic-actions">' +
         '<button class="act-btn' + (isDone(t.id) ? ' on' : '') + '" data-act="toggle-done" data-id="' + t.id + '">' +
         (isDone(t.id) ? '✓ 已掌握' : '标记已掌握') + '</button>' +
         '<button class="act-btn" data-act="to-chapter" data-id="' + ch.id + '">回到本章目录</button>' +
         '</div></div>';

    h += '<div class="md">' + MD.render(t.md) + '</div>';

    var i = topics.indexOf(t);
    var prev = i > 0 ? topics[i - 1] : null;
    var next = i < topics.length - 1 ? topics[i + 1] : null;
    h += '<div class="pager">';
    h += prev
      ? '<a href="#/t/' + prev.id + '"><span>← 上一个</span>' + esc(prev.title) + '</a>'

    h += next
      ? '<a class="next" href="#/t/' + next.id + '"><span>下一个 →</span>' + esc(next.title) + '</a>'
      : '<a class="next"><span>已是最后一个</span>回到总览</a>';
    h += '</div>';
    return h;
  }

  /* ---------------- 闪卡 ---------------- */
  var cards = null, cardIdx = 0, cardShown = false;

  function buildCards() {
    var list = [];
    topics.forEach(function (t) {
      MD.extractQuizzes(t.md).forEach(function (q) {
        list.push({ q: q.q, a: q.a, tid: t.id, ttitle: t.title });
      });
    });
    // 洗牌
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }

  function viewCards() {
    crumbEl.innerHTML = '<b>闪卡自测</b>';
    if (!cards || !cards.length) { cards = buildCards(); cardIdx = 0; cardShown = false; }
    var c = cards[cardIdx];
    var h = '<div class="page-head"><div class="kicker">闪卡</div><h1>随机自测</h1>' +
            '<p>共 ' + cards.length + ' 张，来自所有知识点的考点自测。' +
            '先自己回答，再点「看答案」。</p></div>';
    if (!c) return h + '<div class="empty">还没有自测题。</div>';

    h += '<div class="card-stage">' +
         '<div class="q">' + MD.inline(c.q) + '</div>' +
         '<div class="a' + (cardShown ? '' : ' hidden') + '">' + MD.render(c.a) + '</div>' +
         '<div class="src">出自：<a href="#/t/' + c.tid + '">' + esc(c.ttitle) + '</a>　(' + (cardIdx + 1) + ' / ' + cards.length + ')</div>' +
         '</div>';
    h += '<div class="card-bar">' +
         '<button class="act-btn" data-act="card-show">' + (cardShown ? '收起答案' : '看答案') + '</button>' +
         '<button class="act-btn" data-act="card-next">下一张 →</button>' +
         '<button class="act-btn" data-act="card-shuffle">重新洗牌</button>' +
         '</div>';
    return h;
  }

  /* ---------------- 帮助 ---------------- */
  var HELP_MD = [
    '## 三层结构',
    '',
    '网站只有三个概念：**章（chapter）→ 节（section）→ 知识点（topic）**。',
    '',
    '- 章：`data/ch1-pd.js` 这样的一个文件；',
    '- 节：知识点里的 `section` 字段，相同即归到同一节；',
    '- 知识点：页面正文，字段见下。',
    '',
    '## 新增一个知识点（最常用）',
    '',
    '打开对应章文件（例如 `data/ch5-cns.js`），在 `topics: [ ... ]` 里复制一段加进去：',
    '',
    '```',
    '{',
    '  id: "ch5-mynew",                    // 唯一，改完不要动，否则已掌握记录会丢',
    '  section: "镇痛药",                  // 归到哪一节（写新名字就自动新建一节）',
    '  title: "芬太尼",',
    '  subtitle: "强效阿片受体激动药",',
    '  tags: ["芬太尼", "术后镇痛"],',
    '  key: "一句话结论，会显示在目录卡片上。",',
    '  md: `## 作用',
    '正文……`',
    '}',
    '```',
    '',
    '保存后刷新网页即可，**不需要编译、不需要装任何东西**。',
    '',
    '## 新增一整章',
    '',
    '1. 把 `data/_template.js` 复制成 `data/ch6-xxx.js`（`id` 改成 `ch6`）；',
    '2. 在 `index.html` 里，其他 `data/ch*.js` 下面加一行：`<script src="data/ch6-xxx.js"><\/script>`；',
    '3. 在 `data/manifest.js` 里把 `chapters:[ ... ]` 的 `chapters` 顺序改成你要的顺序。',
    '',
    '## 正文能用的语法',
    '',
    '| 写法 | 效果 |',
    '| --- | --- |',
    '| `## 标题` / `### 小标题` | 分块标题 |',
    '| `- 内容` / `1. 内容` | 列表 |',
    '| `**粗体**` | 强调关键词 |',
    '| `==高亮==` | 荧光笔 |',
    '| `[[ch1-receptor|受体的概念]]` | 跳到另一个知识点（做知识串联的关键） |',
    '| `| a | b |` 换行 `| --- | --- |` | 表格（对比类知识点优先用表格） |',
    '| `> 口诀：……` | 引用块，含「口诀/速记/重点」自动变醒目色 |',
    '| `:::quiz 题干` 换行 答案 换行 `:::` | 可折叠自测题，会自动进入闪卡 |',
    '',
    '## 常见改动',
    '',
    '- 换配色 / 字号：改 `assets/style.css` 顶部 `:root` 里的变量；',
    '- 改首页文案：改 `assets/app.js` 里 `viewHome()` 的字符串；',
    '- 想清空「已掌握」记录：浏览器控制台执行 `localStorage.clear()` 后刷新。',
    '',
    '## 为什么是「静态网页」',
    '',
    '整站是纯 HTML + CSS + JS，双击 `index.html` 就能用，不需要服务器、不需要联网、' +
    '不需要 Node。也正因为如此，改内容只是改文本文件，可以随时加。'
  ].join('\n');

  function viewHelp() {
    crumbEl.innerHTML = '<b>如何增改内容</b>';
    return '<div class="page-head"><div class="kicker">维护指南</div><h1>如何增改内容</h1>' +
      '<p>内容与代码是分开的：改文字只动 <code>data/</code> 下的文件。</p></div>' +
      '<div class="md">' + MD.render(HELP_MD) + '</div>';
  }

  function view404(seg) {
    crumbEl.innerHTML = '<b>未找到</b>';
    return '<div class="empty">没有找到「' + esc(seg) + '」。<br><br>' +
      '<a href="#/">回到总览</a></div>';
  }

  /* ---------------- 搜索 ---------------- */
  var index = topics.map(function (t) {
    return {
      t: t,
      title: t.title.toLowerCase(),
      tags: (t.tags || []).join(' ').toLowerCase(),
      body: (MD.plain(t.md) + ' ' + (t.subtitle || '') + ' ' + (t.key || '')).toLowerCase()
    };
  });

  function doSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    var out = [];
    index.forEach(function (it) {
      var score = 0;
      if (it.title.indexOf(q) > -1) score += 100;
      if (it.tags.indexOf(q) > -1) score += 40;
      if (it.body.indexOf(q) > -1) score += 10;
      if (score) out.push({ it: it, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, 14);
  }

  function renderSearchDropdown(q) {
    var res = doSearch(q);
    if (!q.trim()) { searchResults.hidden = true; return; }
    if (!res.length) {
      searchResults.innerHTML = '<div class="sr-empty">没有匹配，换个关键词（药名、受体名、口诀）</div>';
    } else {
      searchResults.innerHTML = res.map(function (r) {
        var t = r.it.t;
        return '<a class="sr-item" href="#/t/' + t.id + '"><b>' + esc(t.title) + '</b>' +
               '<span>' + esc(t._ch.title + ' · ' + (t.section || '')) + '</span></a>';
      }).join('');
    }
    searchResults.hidden = false;
  }

  /* ---------------- 路由 ---------------- */
  function parse() {
    var h = (location.hash || '#/').replace(/^#/, '');
    if (!h) h = '/';
    var seg = h.split('/').filter(Boolean);
    if (!seg.length) return { name: 'home' };
    if (seg[0] === 't' && seg[1]) return { name: 'topic', id: decodeURIComponent(seg[1]) };
    if (seg[0] === 'ch' && seg[1]) return { name: 'chapter', id: decodeURIComponent(seg[1]) };
    if (seg[0] === 'cards') return { name: 'cards' };
    if (seg[0] === 'help') return { name: 'help' };
    return { name: 'home' };
  }

  function render() {
    var r = parse();
    var activeTopic = null;
    var html;

    if (r.name === 'topic') {
      var t = byId[r.id];
      if (!t) { html = view404(r.id); }
      else {
        activeTopic = t.id;
        state.open[t._ch.id] = true;
        html = viewTopic(t);
      }
    } else if (r.name === 'chapter') {
      var ch = null;
      P.chapters.forEach(function (c) { if (c.id === r.id) ch = c; });
      html = ch ? viewChapter(ch) : view404(r.id);
      if (ch) state.open[ch.id] = true;
    } else if (r.name === 'cards') {
      html = viewCards();
    } else if (r.name === 'help') {
      html = viewHelp();
    } else {
      html = viewHome();
    }

    article.innerHTML = html;
    renderTree(activeTopic);
    renderProgress();
    save('pharm.open', state.open);
    window.scrollTo(0, 0);
    document.body.classList.remove('nav-open');
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act],[data-toggle-ch]') : null;
    if (!el) {
      if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.hidden = true;
      return;
    }

    if (el.hasAttribute('data-toggle-ch')) {
      var id = el.getAttribute('data-toggle-ch');
      state.open[id] = !state.open[id];
      save('pharm.open', state.open);
      var cur = parse();
      renderTree(cur.name === 'topic' && byId[cur.id] ? cur.id : null);
      return;
    }

    var act = el.getAttribute('data-act');
    if (act === 'toggle-done') {
      var tid = el.getAttribute('data-id');
      var k = state.done.indexOf(tid);
      if (k > -1) { state.done.splice(k, 1); toast('已取消标记'); }
      else { state.done.push(tid); toast('已标记掌握 ✓'); }
      save('pharm.done', state.done);
      render();
    } else if (act === 'to-chapter') {
      location.hash = '#/ch/' + el.getAttribute('data-id');
    } else if (act === 'card-show') {
      cardShown = !cardShown;
      render();
    } else if (act === 'card-next') {
      cardIdx = (cardIdx + 1) % cards.length;
      cardShown = false;
      render();
    } else if (act === 'card-shuffle') {
      cards = buildCards();
      cardIdx = 0;
      cardShown = false;
      toast('已重新洗牌');
      render();
    }
  });

  document.getElementById('btnCards').onclick = function () {
    cards = buildCards(); cardIdx = 0; cardShown = false;
    location.hash = '#/cards';
  };
  document.getElementById('btnHelp').onclick = function () { location.hash = '#/help'; };
  document.getElementById('btnTheme').onclick = function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    save('pharm.theme', state.theme);
    applyTheme();
  };
  document.getElementById('btnMenu').onclick = function () {
    document.body.classList.toggle('nav-open');
  };

  searchInput.addEventListener('input', function () { renderSearchDropdown(this.value); });
  searchInput.addEventListener('focus', function () { renderSearchDropdown(this.value); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { this.value = ''; searchResults.hidden = true; this.blur(); }
    if (e.key === 'Enter') {
      var first = searchResults.querySelector('.sr-item');
      if (first) { location.hash = first.getAttribute('href'); searchResults.hidden = true; this.blur(); }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault(); searchInput.focus();
    }
    if (parse().name === 'cards' && (e.key === 'ArrowRight' || e.key === ' ')) {
      if (document.activeElement === searchInput) return;
      e.preventDefault();
      if (!cardShown && e.key === ' ') { cardShown = true; render(); return; }
      cardIdx = (cardIdx + 1) % cards.length; cardShown = false; render();
    }
  });

  window.addEventListener('hashchange', render);

  /* ---------------- 启动 ---------------- */
  render();
})();

</script>
</body>
</html>
